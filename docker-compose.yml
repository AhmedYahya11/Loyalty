# Loyalty Platform — local stack. `docker compose up --build`
# منصة الولاء — بيئة التشغيل المحلية
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loyalty
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        PROJECT: Loyalty.Api
    environment:
      LOYALTY_DB: "Host=postgres;Port=5432;Database=loyalty;Username=loyalty;Password=loyalty"
      Bootstrap__Token: "dev-bootstrap-token-change-me"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Phase 1 processes events in the API host (durable local queue). The worker becomes the
  # dedicated processor once the cross-process Postgres transport is enabled (P5).
  worker:
    build:
      context: ./backend
      args:
        PROJECT: Loyalty.Worker
    environment:
      LOYALTY_DB: "Host=postgres;Port=5432;Database=loyalty;Username=loyalty;Password=loyalty"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["worker"]

volumes:
  pgdata:
